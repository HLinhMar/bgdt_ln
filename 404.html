<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Không tìm thấy trang — Học liệu Toán tương tác</title>
<meta name="description" content="Trang bạn tìm không tồn tại. Quay về thư viện 11 bài giảng điện tử môn Toán THPT."/>
<meta name="robots" content="noindex"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<meta name="theme-color" content="#1553a8"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:32px 20px; text-align:center;
  font-family:'Nunito','Segoe UI',sans-serif; line-height:1.65; color:#0a0e17;
  background:linear-gradient(135deg,#0c2a5c 0%,#1553a8 42%,#2f8ef4 78%,#22d3ee 100%);
  position:relative; overflow:hidden;
}
body::before{
  content:""; position:absolute; inset:0; opacity:.13;
  background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:56px 56px;
}
.box{
  position:relative; z-index:1; max-width:620px; width:100%;
  background:#fff; border-radius:28px; padding:clamp(34px,6vw,56px);
  box-shadow:0 32px 80px rgba(10,31,68,.34);
}
.mark{
  width:76px; height:76px; margin:0 auto 24px; border-radius:22px;
  display:grid; place-items:center; font-size:2rem; color:#fff;
  background:linear-gradient(135deg,#0c2a5c,#1553a8 55%,#22d3ee);
  box-shadow:0 12px 34px rgba(47,142,244,.36);
}
.code{
  font-family:'Merriweather',Georgia,serif; font-size:clamp(3.4rem,11vw,5.2rem);
  font-weight:900; line-height:1; letter-spacing:-.04em; margin-bottom:10px;
  background:linear-gradient(90deg,#1553a8,#2f8ef4,#22d3ee);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
h1{font-family:'Merriweather',Georgia,serif;font-size:clamp(1.25rem,3.4vw,1.6rem);font-weight:900;letter-spacing:-.02em;margin-bottom:14px}
p{color:#3a455c;font-size:.96rem;margin-bottom:28px}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 26px;border-radius:999px;text-decoration:none;
  font-weight:800;font-size:.92rem;transition:transform .22s,box-shadow .22s;
}
.btn-p{background:linear-gradient(135deg,#0c2a5c,#1553a8 55%,#22d3ee);color:#fff;box-shadow:0 10px 30px rgba(47,142,244,.3)}
.btn-g{background:#fff;color:#0a0e17;border:1px solid #e4e9f1}
.btn:hover{transform:translateY(-3px)}
.btn:focus-visible{outline:3px solid #d97706;outline-offset:3px}
.hint{margin-top:26px;padding-top:22px;border-top:1px solid #eef2f8;font-size:.82rem;color:#5f6c85}
@media (prefers-reduced-motion: reduce){ .btn{transition:none} }
</style>
</head>
<body>
  <main class="box">
    <div class="mark"><i class="fa-solid fa-compass" aria-hidden="true"></i></div>
    <div class="code">404</div>
    <h1>Không tìm thấy trang này</h1>
    <p>
      Đường dẫn bạn vừa mở không tồn tại hoặc đã được đổi tên.
      Bạn có thể quay về thư viện để chọn lại bài giảng cần dùng.
    </p>
    <div class="acts">
      <a class="btn btn-p" href="/"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i> Về thư viện bài giảng</a>
      <a class="btn btn-g" href="javascript:history.back()"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Quay lại trang trước</a>
    </div>
    <p class="hint">Học liệu Toán tương tác &middot; 11 bài giảng điện tử Toán 10 &amp; 11 &middot; Chương trình GDPT 2018</p>
  </main>
</body>
</html>
